# Vantage · continuous integration
# ------------------------------------------------------------------
# Four gates, in the order a regression would hit them:
#
#   audit        static checks the type checker cannot see
#   bundle       committed artifacts are up to date with src/
#   unit         the engine, headless, against the mock runtime
#   verify-dist  the shipped bytes, loaded via `loadstring`, no `script`
#
# and three that guard the things that only break in real use:
#
#   verify-http  the artifacts served over HTTP, byte-identical, then run
#   docs-check   the documentation's own contract with its scripts
#   repo-audit   the repository is uploadable as-is and ships no `script`
#
# verify-dist is the gate that matters for the distribution model: it is the
# only check that fails if the file stops working when fetched from a URL.
# `npm run test:remote` complements it outside CI by comparing the published
# URLs against this checkout — a stale upload passes every gate here and
# still fails for every player.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install the Luau CLI
        run: bash tools/install-toolchain.sh

      - name: Audit
        run: node tools/audit.mjs

      - name: Bundles are up to date
        run: node tools/bundle.mjs --check

      - name: Unit suite
        run: node tools/test.mjs

      - name: Loadstring integration (annotated and minified)
        run: node tools/verify-dist.mjs

      - name: The root bundle matches the canonical one
        run: cmp Vantage.luau dist/Vantage.luau

      - name: Loadstring over real HTTP
        run: node tools/verify-http.mjs

      - name: Documentation contract
        run: node tools/docs-check.mjs

      - name: Repository is uploadable as-is
        run: node tools/repo-audit.mjs
